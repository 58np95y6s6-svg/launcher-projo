# Vidéo de présentation du design NBA : captures de la vraie appli dans un émulateur Android TV
# (données ESPN réelles), publiées sur la branche « captures/video-nba ». Branche à part, jamais
# publiée dans l'appli.
name: Vidéo NBA

on:
  push:
    branches: ["claude/video-nba"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-nba
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle (3 essais)
        run: for essai in 1 2 3; do ./gradlew --no-daemon --version > /dev/null && exit 0; echo "Essai $essai raté"; sleep 30; done; exit 1

      - name: Compilation pour l'émulateur (x86 en plus)
        env:
          VERSION_NAME: video-${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease -PabiEmulateur=x86

      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur Android TV et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/video-nba.sh

      - name: Publication des captures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d video ] || exit 0
          cd video
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Captures de la vidéo NBA (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/captures/video-nba"
          echo "Captures publiées sur la branche captures/video-nba"
