# iBiTube : compile la variante « ibitube » de SmartTube (APK release), la signe avec ta clé si les
# secrets existent, dépose les APK en artefact et publie une version GitHub sur les tags « v* ».
#
# À chaque push sur la branche ibitube, l'APK est aussi publié à une adresse fixe :
#   https://github.com/<compte>/launcher-projo/releases/download/ibitube-apk/iBiTube.apk
#
# Secrets (Settings → Secrets and variables → Actions) : KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD (voir README-IBITUBE.md). Sans eux, l'APK est signé avec la clé de test
# du dépôt (ibitube/signature/test.keystore) : chaque version s'installe par-dessus la précédente,
# mais aucune version « v* » n'est publiée.
name: iBiTube

on:
  push:
    branches: [ibitube]
    tags: ["v*"]
  pull_request:
    branches: [ibitube]
  workflow_dispatch:

concurrency:
  group: ibitube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK iBiTube
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # publication de la version sur les tags v*
    steps:
      - name: Récupération du code et des sous-modules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17 et cache Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          manquants=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || manquants="$manquants $v"
          done
          if [ -n "$manquants" ]; then
            echo "::notice::Secrets absents :$manquants. APK signé avec la clé de test du dépôt."
            echo "SIGNE=non" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ibitube.jks"
          # keystore.properties est lu par smarttubetv/build.gradle (mécanisme d'origine de SmartTube)
          {
            echo "storeFile=$RUNNER_TEMP/ibitube.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "SIGNE=oui" >> "$GITHUB_ENV"

      - name: Compilation (assembleIbitubeRelease)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleIbitubeRelease

      - name: Contrôles de l'APK
        run: |
          set -euo pipefail
          dossier=smarttubetv/build/outputs/apk/ibitube/release
          ls -la "$dossier"
          apk=$(ls "$dossier"/iBiTube_*_universal.apk)
          outils=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$outils/aapt" dump badging "$apk" > badging.txt
          head -3 badging.txt
          grep -q "package: name='com.ibi.ibitube'" badging.txt || { echo "::error::applicationId inattendu"; exit 1; }
          grep -q "versionName='[^']*-ibi'" badging.txt || { echo "::error::versionName sans -ibi"; exit 1; }
          grep -q "application-label:'iBiTube'" badging.txt || { echo "::error::nom affiché différent d'iBiTube"; exit 1; }
          # Installation à côté de SmartTube : aucune autorité de fournisseur ne doit reprendre la sienne
          "$outils/aapt" dump xmltree "$apk" AndroidManifest.xml | grep "android:authorities" | tee autorites.txt
          if grep -qi "smarttube" autorites.txt; then echo "::error::autorité SmartTube dans le manifeste"; exit 1; fi
          # Mises à jour coupées : aucun fichier de mise à jour de SmartTube (smarttube_stable2.json…)
          # dans les ressources. Le lien « code source » vers SmartTubeNext, lui, reste (crédit MIT).
          "$outils/aapt" dump --values resources "$apk" > ressources.txt
          if grep -Eqi "smarttube_(stable|beta)[0-9]*\.json" ressources.txt; then
            echo "::error::adresse de mise à jour SmartTube trouvée"; exit 1
          fi
          "$outils/apksigner" verify --print-certs "$apk" > signature.txt
          head -2 signature.txt
          version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "### iBiTube $version"
            echo "- Identifiant : com.ibi.ibitube (s'installe à côté de SmartTube)"
            echo "- Signature : $([ "$SIGNE" = oui ] && echo "ta clé (secrets)" || echo "clé de test du dépôt")"
            echo "- APK : $(cd "$dossier" && ls *.apk | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dépôt des APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: iBiTube-${{ env.VERSION }}
          path: smarttubetv/build/outputs/apk/ibitube/release/*.apk
          if-no-files-found: error

      # APK « en continu » : chaque push sur ibitube remplace la pré-version ibitube-apk, avec des noms
      # de fichiers fixes, pour un lien de téléchargement qui ne change jamais (Downloader sur Fire TV).
      # Le tag s'appelle ibitube-apk et non ibitube, pour ne pas porter le même nom que la branche.
      - name: Publication de l'APK en continu (branche ibitube)
        if: github.event_name == 'push' && github.ref == 'refs/heads/ibitube'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          dossier=smarttubetv/build/outputs/apk/ibitube/release
          mkdir -p publication
          cp "$dossier"/iBiTube_*_universal.apk publication/iBiTube.apk
          cp "$dossier"/iBiTube_*_armeabi-v7a.apk publication/iBiTube-armeabi-v7a.apk
          cp "$dossier"/iBiTube_*_arm64-v8a.apk publication/iBiTube-arm64-v8a.apk
          gh release delete ibitube-apk --cleanup-tag --yes || true
          gh release create ibitube-apk publication/*.apk \
            --prerelease --latest=false \
            --target "${{ github.sha }}" \
            --title "iBiTube $VERSION (en continu)" \
            --notes "iBiTube $VERSION compilé depuis la branche ibitube (${{ github.sha }}). Lien direct : https://github.com/${{ github.repository }}/releases/download/ibitube-apk/iBiTube.apk"
          # Parade déjà utilisée par le launcher : une version recréée trop vite peut rester en brouillon
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '[.[] | select(.tag_name=="ibitube-apk")][0].id' || true)
          if [ -n "$id" ]; then
            brouillon=$(gh api "repos/${{ github.repository }}/releases/$id" --jq '.draft' || true)
            if [ "$brouillon" = "true" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false -f tag_name=ibitube-apk > /dev/null || true
            fi
          fi
          echo "- Téléchargement : https://github.com/${{ github.repository }}/releases/download/ibitube-apk/iBiTube.apk" >> "$GITHUB_STEP_SUMMARY"

      # Version GitHub : seulement sur un tag v*, et seulement avec ta vraie clé.
      # Publiée en pré-version et jamais « latest » : le launcher Projo, dans le même dépôt, suit
      # releases/latest pour ses propres mises à jour ; une version iBiTube ne doit pas s'y glisser.
      - name: Publication de la version (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$SIGNE" != oui ]; then
            echo "::error::Aucune version publiée sans les 4 secrets de signature."; exit 1
          fi
          cd smarttubetv/build/outputs/apk/ibitube/release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.apk --clobber
          else
            gh release create "$TAG" *.apk --title "iBiTube $VERSION" --prerelease --latest=false \
              --notes "iBiTube $VERSION, variante de SmartTube (identifiant com.ibi.ibitube). Pour un Fire TV : APK armeabi-v7a ; en cas de doute : universal."
          fi

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/ibitube.jks" keystore.properties
