# Compile le launcher à chaque push et publie un APK de TEST téléchargeable :
#   https://github.com/<compte>/launcher-projo/releases/download/test/launcher-test.apk
# (signé avec la clé de test du dépôt : les versions de test s'installent les unes sur les autres)
name: Build test

# Les branches « captures/… » (résultats des tests, publiés plus bas) et « gh-pages »
# (télécommande publiée) ne relancent rien
on:
  push:
    branches: ["**", "!captures/**", "!gh-pages"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation (APK de test + vérification de la version release)
        env:
          VERSION_NAME: test-${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Taille des APK
        run: |
          ls -l app/build/outputs/apk/*/*.apk
          unzip -lv app/build/outputs/apk/release/*.apk | awk '{d=$NF; sub(/\/.*/, "", d); n[d]+=$1; c[d]+=$3} END {for (k in n) printf "%-24s %10d octets (%d compressés)\n", k, n[k], c[k]}' | sort

      - name: Publication de l'APK de test
        # Seule la branche de test publie l'APK ; les autres branches compilent seulement
        if: github.ref_name == 'claude/launcher-projo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk launcher-test.apk
          gh release delete test --cleanup-tag --yes || true
          gh release create test launcher-test.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Version de test #${{ github.run_number }}" \
            --notes "APK de test compilé depuis ${{ github.ref_name }} (${{ github.sha }})."

  # Tests d'interface (Robolectric) : navigation à la télécommande et captures des 5 designs.
  # Job séparé : un test qui échoue ne bloque jamais la compilation ni la publication de l'APK.
  # Résultats publiés sur la branche « captures/<branche> » (captures/*.png + resultats.txt).
  tests:
    runs-on: ubuntu-latest
    # Un test bloqué (attente sans fin) ne doit pas occuper la machine des heures
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric télécharge une image d'Android (plusieurs centaines de Mo) au premier test
      - name: Cache d'Android pour Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Tests d'interface (navigation + captures)
        env:
          # Clé TMDB des captures « réelles » (NouveautesTest), sous un autre nom que TMDB_KEY :
          # elle n'est pas compilée dans l'app des tests, les autres tests restent hors ligne
          TMDB_KEY_TESTS: ${{ secrets.TMDB_KEY }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --continue 2>&1 | tee tests.log

      - name: Publication des captures et des résultats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCHE="captures/${GITHUB_REF_NAME//\//-}"
          SORTIE="$RUNNER_TEMP/publication"
          rm -rf "$SORTIE" && mkdir -p "$SORTIE/captures"
          cp app/build/captures/*.png "$SORTIE/captures/" 2>/dev/null || true
          {
            echo "# Commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), build n°${GITHUB_RUN_NUMBER}"
            python3 .github/scripts/resultats.py app/build/test-results || echo "# Résultats illisibles"
          } > "$SORTIE/resultats.txt"
          tail -n 500 tests.log > "$SORTIE/journal.txt" 2>/dev/null || true
          cd "$SORTIE"
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Résultats des tests de ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCHE}"
          echo "Résultats publiés sur la branche ${BRANCHE}"
