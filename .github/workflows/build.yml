# Compile le launcher à chaque push et publie un APK de TEST téléchargeable :
#   https://github.com/<compte>/launcher-projo/releases/download/test/launcher-test.apk
# (signé avec la clé de test du dépôt : les versions de test s'installent les unes sur les autres)
name: Build test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation (APK de test + vérification de la version release)
        env:
          VERSION_NAME: test-${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Publication de l'APK de test
        # Seule la branche de test publie l'APK ; les autres branches compilent seulement
        if: github.ref_name == 'claude/launcher-projo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk launcher-test.apk
          gh release delete test --cleanup-tag --yes || true
          gh release create test launcher-test.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Version de test #${{ github.run_number }}" \
            --notes "APK de test compilé depuis ${{ github.ref_name }} (${{ github.sha }})."

      - name: Publication de l'APK Fire TV
        # Branche Fire TV : sa propre version de test, sans toucher à celle du projecteur
        if: github.ref_name == 'claude/launcher-firetv'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk launcher-firetv.apk
          gh release delete firetv --cleanup-tag --yes || true
          gh release create firetv launcher-firetv.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Version Fire TV #${{ github.run_number }}" \
            --notes "APK Fire TV compilé depuis ${{ github.ref_name }} (${{ github.sha }}). Lien direct : https://github.com/${{ github.repository }}/releases/download/firetv/launcher-firetv.apk"
