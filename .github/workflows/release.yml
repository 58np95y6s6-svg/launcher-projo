# Publication d'une version : à chaque tag « v* » (ex. v1.0.0), compile un APK release
# signé avec TA clé (secrets GitHub) et le publie sous le nom fixe « launcher.apk ».
# Lien toujours valide vers la dernière version :
#   https://github.com/<compte>/launcher-projo/releases/latest/download/launcher.apk
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérification des secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret manquant : $v (voir README, « Publier une version »)"; exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/publication.jks"

      - name: Compilation de l'APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/publication.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          # Clé TMDB (suggestions du design Studio) : secret du dépôt, jamais affichée
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publication dans GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk launcher.apk
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release déjà créée à la main sur GitHub : on y ajoute (ou remplace) l'APK
            gh release upload "$TAG" launcher.apk --clobber
          else
            gh release create "$TAG" launcher.apk --title "Projo $TAG" --generate-notes --latest
          fi

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/publication.jks"
