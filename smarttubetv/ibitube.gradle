// iBiTube : variante « ibitube » de SmartTube (seule l'identité visuelle change).
// Appliqué par une seule ligne dans build.gradle (« apply from: 'ibitube.gradle' ») pour que les
// fusions avec le dépôt d'origine ne touchent jamais ce fichier.
//
// Compilation : ./gradlew assembleIbitubeRelease
// Ressources propres à la variante : src/ibitube/ (elles priment sur src/main et sur les modules).

android {
    // Clé de TEST versionnée (ibitube/signature/test.keystore, mots de passe Android standard) :
    // toutes les compilations sans clé de publication portent la même signature et s'installent
    // donc les unes par-dessus les autres. Ne protège rien : la vraie clé reste dans les secrets.
    signingConfigs {
        ibitubeTest {
            storeFile rootProject.file('ibitube/signature/test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    productFlavors {
        ibitube {
            // Identifiant distinct : s'installe à côté de SmartTube sans le remplacer
            applicationId "com.ibi.ibitube"
            versionNameSuffix "-ibi"
            targetSdkVersion project.properties.compileSdkVersion

            // Les modules common et leanbackassistant n'ont pas de variante « ibitube » : ils
            // prennent leur variante F-Droid, la seule sans adresse de mise à jour et dont le
            // fournisseur de recherche dépend de l'applicationId (pas de conflit avec SmartTube).
            matchingFallbacks = ['stfdroid']

            // Sans keystore.properties (CI sans secrets, poste local), l'APK release est signé avec
            // la clé de test ci-dessus. Avec keystore.properties, le type de build « release » de
            // l'amont impose la vraie clé (prioritaire sur celle-ci).
            signingConfig signingConfigs.ibitubeTest
        }
    }
}

// Noms des APK : iBiTube_<version>_<abi>.apk. Le bloc de l'amont nomme les fichiers pendant la
// création des variantes (« SmartTube_itube_… ») et AGP fige ce nom ensuite : on renomme donc les
// fichiers une fois l'assemblage terminé.
tasks.configureEach { tache ->
    if (tache.name == 'assembleIbitubeRelease' || tache.name == 'assembleIbitubeDebug') {
        tache.doLast {
            def dossier = file("${buildDir}/outputs/apk/ibitube/${tache.name.endsWith('Release') ? 'release' : 'debug'}")
            if (dossier.isDirectory()) {
                dossier.eachFileMatch(~/SmartTube_itube_.*\.apk/) { apk ->
                    apk.renameTo(new File(dossier, apk.name.replace('SmartTube_itube_', 'iBiTube_')))
                }
            }
        }
    }
}
