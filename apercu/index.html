<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iBiTV · Galerie</title>
<!--
  Concept « Galerie » pour la TV, inspiré des interfaces en verre flottant.
  Trois étages navigables à la télécommande, rien de décoratif qui ait l'air d'un bouton :
   1. En haut : Pour vous / Films / Séries / Ma liste, météo (info), Réglages.
   2. Au centre : carrousel des titres du moment (TMDB). ◀ ▶ : chaque image glisse vers la place
      suivante de la composition ; le titre au centre a son synopsis sur un panneau de verre,
      « Regarder sur … » (ouvre l'appli sur ce titre) et « Bande-annonce ».
   3. En bas : le dock des applis façon Mac (icône en focus grossie, nom au-dessus).
-->
<style>
@font-face { font-family: Serif; src: url(polices/instrument-serif-latin-400-normal.woff2); }
@font-face { font-family: M; font-weight: 400; src: url(polices/manrope-latin-400-normal.woff2); }
@font-face { font-family: M; font-weight: 500; src: url(polices/manrope-latin-500-normal.woff2); }
@font-face { font-family: M; font-weight: 600; src: url(polices/manrope-latin-600-normal.woff2); }
@font-face { font-family: M; font-weight: 700; src: url(polices/manrope-latin-700-normal.woff2); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; background: #b4b6bb; font-family: M, sans-serif; color: #2b2d33; }
/* scène 1920 × 1080, mise à l'échelle de la fenêtre */
#scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background: radial-gradient(ellipse 120% 85% at 50% 22%, #e6e7ea 0%, #d0d1d5 45%, #b4b6bb 75%, #a2a4a9 100%); }
.sol { position: absolute; left: 0; right: 0; top: 860px; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(236,237,240,.55) 35%, rgba(196,198,203,.9) 100%); }
.horizon { position: absolute; left: 0; right: 0; top: 860px; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); }

.verre { background: linear-gradient(160deg, rgba(255,255,255,.42), rgba(255,255,255,.16) 55%, rgba(255,255,255,.26));
  border: 1.5px solid rgba(255,255,255,.62); backdrop-filter: blur(24px) saturate(1.35);
  box-shadow: 0 1px 0 rgba(255,255,255,.75) inset, 0 18px 40px rgba(40,44,52,.16), 0 2px 6px rgba(40,44,52,.06); }
.pilule { border-radius: 999px; display: inline-flex; align-items: center; }
.anneau { box-shadow: 0 0 0 3px #fff, 0 0 0 6px rgba(43,45,51,.9), 0 22px 44px rgba(20,22,28,.3) !important; }

/* ---------- étage 1 ---------- */
.logo { position: absolute; left: 72px; top: 50px; display: flex; align-items: center; gap: 14px; font-size: 27px; font-weight: 700; color: #34363d; }
.logo .pastille { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.logo .pastille svg { width: 26px; height: 26px; }
.logo small { display: block; font-size: 15px; font-weight: 500; color: #7c7f88; margin-top: 2px; }
.onglets { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); padding: 6px; gap: 4px; }
.onglet { padding: 12px 30px; border-radius: 999px; font-size: 19px; font-weight: 600; color: #5d6069; }
.onglet.actif { background: #2b2d33; color: #fff; box-shadow: 0 8px 18px rgba(0,0,0,.22); }
.meteo { position: absolute; right: 150px; top: 54px; padding: 10px 22px 10px 14px; gap: 12px; font-size: 18px; font-weight: 600; color: #34363d; }
.meteo svg { width: 34px; height: 34px; }
.meteo small { color: #7c7f88; font-weight: 500; font-size: 15px; }
.reglages { position: absolute; right: 72px; top: 52px; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.reglages svg { width: 26px; height: 26px; stroke: #34363d; fill: none; stroke-width: 1.9; }
.credit { position: absolute; right: 74px; top: 126px; font-size: 13px; color: rgba(60,62,70,.55); }

/* ---------- étage 2 : carrousel ---------- */
:root { --duree: .9s; --courbe: cubic-bezier(.62,.04,.24,1); }
.carte { position: absolute; border-radius: 26px; overflow: hidden; background: #0b0b0e; z-index: 2;
  box-shadow: 0 26px 50px rgba(20,22,28,.28);
  transition: left var(--duree) var(--courbe), top var(--duree) var(--courbe), width var(--duree) var(--courbe), height var(--duree) var(--courbe),
    border-radius var(--duree) var(--courbe), filter var(--duree) var(--courbe), opacity var(--duree) var(--courbe); }
.carte::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 4; box-shadow: 0 0 0 1.5px rgba(255,255,255,.4) inset; background: linear-gradient(140deg, rgba(255,255,255,.26), rgba(255,255,255,0) 35%); }
.carte .couche { position: absolute; inset: 0; background-size: cover; background-position: center 30%; transition: opacity var(--duree) var(--courbe), filter var(--duree) var(--courbe); }
.carte .po { opacity: 0; background-position: center; }
.carte.affiche .po { opacity: 1; }
.carte.affiche .bd { opacity: 0; }
.carte.floue { filter: blur(2.5px) saturate(1.3); }
.carte.nb { filter: grayscale(1) contrast(1.1); }
.carte.loin { filter: blur(3px) saturate(1.2); }
.carte.cache { opacity: 0; }
.carte.heros { z-index: 3; box-shadow: 0 40px 80px rgba(20,22,28,.35); }
.carte.heros .bd { filter: blur(2px) saturate(1.35) contrast(1.06); }
.carte .contenu { position: absolute; inset: 0; z-index: 3; opacity: 0; transition: opacity .35s ease; }
.carte.heros .contenu { opacity: 1; transition: opacity .45s ease .55s; }
.contenu .voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,8,.9) 0%, rgba(5,5,8,.5) 32%, rgba(5,5,8,.05) 62%, rgba(5,5,8,.4) 100%); }
.contenu .haut { position: absolute; left: 34px; right: 34px; top: 28px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
.contenu .service { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
.contenu .service i { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 17px; font-weight: 800; }
.contenu .rang { font-family: Serif; font-size: 22px; opacity: .9; }
.contenu h1 { position: absolute; left: 60px; right: 60px; top: 104px; margin: 0; text-align: center; color: #fff; font-family: Serif; font-weight: 400; font-size: 60px; line-height: 1.04; text-shadow: 0 2px 22px rgba(0,0,0,.45); }
.contenu .infos { position: absolute; left: 0; right: 0; top: 262px; display: flex; justify-content: center; gap: 8px; }
.badge { padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); color: #fff; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.08); }
.badge.note { background: rgba(255,255,255,.9); color: #1b1c20; border-color: transparent; }
.coche { position: absolute; left: 50%; top: 52%; margin: -15px; z-index: 5; transition: opacity .4s; }
.carte.heros .coche { opacity: 0; }
.halo { position: absolute; left: 660px; top: 200px; width: 860px; height: 500px; border-radius: 60px; filter: blur(80px) saturate(1.7); background-size: cover; background-position: center;
  opacity: 0; transition: opacity var(--duree) ease; z-index: 1; }
.halo.actif { opacity: .7; }
.ajout { position: absolute; left: 132px; top: 452px; padding: 12px 28px; font-size: 16px; font-weight: 600; background: rgba(60,62,70,.55) !important; color: #fff; border-color: rgba(255,255,255,.25) !important; z-index: 6; }
.agrandir { position: absolute; left: 372px; top: 448px; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 6; }
.agrandir svg { width: 20px; height: 20px; stroke: #3b3d44; fill: none; stroke-width: 2; }
.fleche { position: absolute; top: 402px; width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 8; cursor: pointer; }
.fleche svg { width: 26px; height: 26px; stroke: #34363d; fill: none; stroke-width: 2.2; }

/* panneau synopsis (verre) à cheval sur le bas du titre au centre */
.synopsis { position: absolute; left: 650px; top: 600px; width: 880px; height: 236px; border-radius: 32px; z-index: 7; overflow: hidden;
  background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(246,247,249,.6) 60%, rgba(255,255,255,.7)) !important; backdrop-filter: blur(30px) saturate(1.2) !important; }
.syn { position: absolute; left: 30px; right: 30px; top: 26px; opacity: 0; transition: opacity .35s ease; }
.syn.actif { opacity: 1; transition: opacity .5s ease .45s; }
.syn .tete { display: flex; align-items: center; gap: 12px; font-size: 15px; color: #55585f; font-weight: 600; }
.syn .tete b { color: #2b2d33; }
.syn p { margin: 10px 0 0; font-size: 19.5px; line-height: 1.5; color: #26282d; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 12px; }
.bouton { height: 54px; padding: 0 24px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #2b2d33; position: relative;
  background: rgba(255,255,255,.5); box-shadow: 0 0 0 1.3px rgba(255,255,255,.75) inset, 0 6px 16px rgba(0,0,0,.08); }
.bouton svg { width: 20px; height: 20px; }
.bouton.principal { background: #1d1e22; color: #fff; width: 300px; }
.bouton.principal svg { position: absolute; left: 26px; }
.bouton .etiq { position: absolute; left: 56px; right: 18px; text-align: center; opacity: 0; transition: opacity .3s; white-space: nowrap; }
.bouton .etiq.actif { opacity: 1; transition: opacity .4s ease .45s; }
.trait { position: absolute; left: 30px; right: 30px; bottom: 0; height: 4px; border-radius: 4px; opacity: 0; transition: opacity var(--duree) ease; }
.trait-lueur { position: absolute; left: 80px; right: 80px; bottom: -16px; height: 40px; border-radius: 40px; filter: blur(22px); opacity: 0; transition: opacity var(--duree) ease; }
.trait.actif { opacity: 1; } .trait-lueur.actif { opacity: .55; }
.points { position: absolute; right: 30px; bottom: 44px; display: flex; gap: 7px; }
.points i { width: 8px; height: 8px; border-radius: 4px; background: rgba(43,45,51,.25); transition: width .5s var(--courbe), background-color .5s; }
.points i.on { width: 26px; background: #2b2d33; }

/* ---------- étage 3 : dock des applis (façon Mac) ---------- */
.dock { position: absolute; left: 50%; transform: translateX(-50%); top: 914px; height: 128px; border-radius: 36px; padding: 0 22px; display: flex; align-items: flex-end; gap: 16px; z-index: 7; }
.dock .sep { width: 2px; height: 74px; align-self: center; border-radius: 1px; background: rgba(60,62,70,.18); margin: 0 4px; }
.icone { width: 92px; height: 92px; border-radius: 22px; position: relative; margin-bottom: 18px; flex: none; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset, 0 10px 20px rgba(0,0,0,.18); }
.icone::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,0) 45%); }
.icone > svg { position: relative; }
.icone .point { position: absolute; bottom: -12px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: rgba(43,45,51,.55); }
.icone.g1 { width: 104px; height: 104px; border-radius: 25px; }
.icone.g2 { width: 128px; height: 128px; border-radius: 30px; margin-bottom: 30px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px rgba(43,45,51,.9), 0 20px 34px rgba(0,0,0,.28); }
.icone .bulle { position: absolute; bottom: calc(100% + 18px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 8px 16px; border-radius: 12px; font-size: 17px; font-weight: 700; color: #fff; background: rgba(30,32,38,.82); box-shadow: 0 8px 18px rgba(0,0,0,.25); }
.reflet-dock { position: absolute; left: 50%; transform: translateX(-50%) scaleY(-1); top: 1044px; height: 60px; display: flex; align-items: flex-end; gap: 16px; padding: 0 22px; opacity: .22; filter: blur(4px);
  -webkit-mask-image: linear-gradient(180deg, transparent 20%, #000 100%); }
.reflet-dock div { flex: none; border-radius: 22px; }
</style></head>
<body>
<div id="scene">
<div class="sol"></div><div class="horizon"></div>

<!-- étage 1 -->
<div class="logo"><span class="pastille verre"><svg viewBox="0 0 24 24" fill="none" stroke="#34363d" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/><circle cx="12" cy="12" r="3.2" fill="#e9eaee"/></svg></span>
  <div>iBiTV<small>20:41 · mardi 3 novembre</small></div></div>
<div class="onglets verre pilule"><span class="onglet actif">Pour vous</span><span class="onglet">Films</span><span class="onglet">Séries</span><span class="onglet">Ma liste</span></div>
<div class="meteo verre pilule"><svg viewBox="0 0 64 64"><circle cx="40" cy="22" r="11" fill="#f3c969"/><path d="M18 46h30a10 10 0 000-20 14 14 0 00-26 4 8 8 0 00-4 16z" fill="#fff"/></svg>14°<small>Paris</small></div>
<div class="reglages verre"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></div>
<div class="credit" id="credit">Titres et images : TMDB</div>

<!-- étage 2 -->
<div id="halos"></div>
<div id="cartes"></div>
<div class="ajout verre pilule">Ajouter à ma liste</div>
<div class="agrandir verre"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></div>
<div class="fleche verre" id="precedent" style="left:588px" onclick="precedent()"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div>
<div class="fleche verre" id="suivant" style="left:1530px" onclick="suivant()"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
<div class="synopsis verre" id="synopsis">
  <div id="syns"></div>
  <div class="actions">
    <span class="bouton principal" id="regarder"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="#fff"/></svg></span>
    <span class="bouton"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2d33" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="#2b2d33"/></svg>Bande-annonce</span>
  </div>
  <div class="points" id="points"></div>
  <div id="traits"></div>
</div>

<!-- étage 3 -->
<div class="dock verre" id="dock"></div>
<div class="reflet-dock" id="reflet-dock"></div>
</div>

<script src="donnees.js"></script>
<script>
const T = window.DONNEES.titres;
const N = T.length;
const $ = id => document.getElementById(id);
const url = u => `url("${u}")`;
const SERVICES = {
  "Netflix": { logo: "N", fond: "#000", texte: "#e50914", trait: "linear-gradient(90deg,#e50914,#ff6a3d 55%,#e50914)" },
  "Amazon Prime Video": { logo: "p", fond: "#0f79af", texte: "#fff", trait: "linear-gradient(90deg,#00a8e1,#7fd3f5 55%,#00a8e1)" },
  "Prime Video": { logo: "p", fond: "#0f79af", texte: "#fff", trait: "linear-gradient(90deg,#00a8e1,#7fd3f5 55%,#00a8e1)" },
  "Disney Plus": { logo: "D+", fond: "#0b1e5b", texte: "#fff", trait: "linear-gradient(90deg,#1b3fa8,#4ad0e8 55%,#1b3fa8)" },
  "Disney+": { logo: "D+", fond: "#0b1e5b", texte: "#fff", trait: "linear-gradient(90deg,#1b3fa8,#4ad0e8 55%,#1b3fa8)" },
  "Canal+": { logo: "+", fond: "#000", texte: "#fff", trait: "linear-gradient(90deg,#222,#888 55%,#222)" },
  "CANAL+": { logo: "+", fond: "#000", texte: "#fff", trait: "linear-gradient(90deg,#222,#888 55%,#222)" },
};
const DEFAUT = { logo: "▶", fond: "rgba(255,255,255,.2)", texte: "#fff", trait: "linear-gradient(90deg,#4f8df5,#f07090 40%,#f2d160 62%,#7dcf8a)" };
const sv = t => SERVICES[t.plateforme] || DEFAUT;

// Places de la composition, par décalage par rapport au titre au centre (0).
// ▶ : chaque titre glisse d'une place vers la gauche (+1 vient au centre, le centre monte en haut à gauche…).
const PLACES = {
  "-5": { l: -330, t: 238, w: 176, h: 310, cls: "affiche cache" },   // sorti à gauche
  "-4": { l: -76, t: 238, w: 176, h: 310, cls: "affiche" },          // coupée par le bord
  "-3": { l: 378, t: 528, w: 200, h: 206, cls: "nb" },               // en bas, noir et blanc
  "-2": { l: 112, t: 528, w: 250, h: 206, cls: "" },                 // en bas à gauche
  "-1": { l: 300, t: 196, w: 276, h: 232, cls: "floue" },            // en haut
  "0":  { l: 620, t: 150, w: 940, h: 560, cls: "heros", r: 34 },     // au centre
  "1":  { l: 1600, t: 236, w: 420, h: 300, cls: "floue" },           // à droite, coupée par le bord
  "2":  { l: 1640, t: 560, w: 230, h: 168, cls: "loin" },            // à droite, en bas
  "3":  { l: 1990, t: 520, w: 230, h: 168, cls: "loin cache" },      // pas encore entré
};
const VU = 1;  // un titre « déjà vu » (coché)
let courant = 0;

const cartes = [], halos = [], syns = [], etiquettes = [], traits = [], lueurs = [];
T.forEach((t, i) => {
  const c = document.createElement("div");
  c.className = "carte";
  const s = sv(t);
  const morceaux = t.sous.split(" · ");
  const infos = [morceaux[0], morceaux[1], t.annee].filter(Boolean).map(x => `<span class="badge">${x}</span>`).join("")
    + (t.note ? `<span class="badge note">★ ${t.note}</span>` : "");
  c.innerHTML = `<div class="couche bd" style='background-image:${url(t.backdrop)}'></div><div class="couche po" style='background-image:${url(t.poster)}'></div>
    <div class="contenu"><div class="voile"></div>
      <div class="haut"><span class="service"><i style="background:${s.fond};color:${s.texte}">${s.logo}</i>${(t.plateforme || "").toUpperCase()}</span><span class="rang">N°${i + 1} cette semaine</span></div>
      <h1></h1><div class="infos">${infos}</div></div>
    ${i === VU ? '<svg class="coche" width="30" height="30" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="rgba(255,255,255,.92)"/><path d="M8 14.5l4 4 8-9" stroke="#2b2d33" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>' : ""}`;
  c.querySelector("h1").textContent = t.titre;
  $("cartes").appendChild(c); cartes.push(c);

  const h = document.createElement("div"); h.className = "halo"; h.style.backgroundImage = url(t.backdrop); $("halos").appendChild(h); halos.push(h);

  const y = document.createElement("div"); y.className = "syn";
  y.innerHTML = `<div class="tete"><b></b><span>·</span><span></span></div><p></p>`;
  y.querySelector("b").textContent = t.titre;
  y.querySelector(".tete span:last-child").textContent = [t.sous, t.annee].filter(Boolean).join(" · ");
  y.querySelector("p").textContent = t.resume || "Résumé du titre, fourni par TMDB en français.";
  $("syns").appendChild(y); syns.push(y);

  const e = document.createElement("span"); e.className = "etiq";
  e.textContent = SERVICES[t.plateforme] ? "Regarder sur " + t.plateforme.replace("Amazon ", "") : "Où regarder ?";
  $("regarder").appendChild(e); etiquettes.push(e);

  const tr = document.createElement("div"); tr.className = "trait"; tr.style.background = s.trait;
  const lu = document.createElement("div"); lu.className = "trait-lueur"; lu.style.background = s.trait;
  $("traits").append(lu, tr); traits.push(tr); lueurs.push(lu);
});
$("points").innerHTML = T.map(() => "<i></i>").join("");

function decalage(i) {
  let o = ((i - courant) % N + N) % N;
  if (o > N / 2) o -= N;
  return o;
}
function placer() {
  T.forEach((_, i) => {
    const o = decalage(i);
    const p = PLACES[Math.max(-5, Math.min(3, o))];
    const c = cartes[i];
    // Une carte cachée qui passe d'un bord à l'autre (fin de liste) se déplace sans animation
    const avant = c.dataset.o;
    const saut = avant !== undefined && Math.abs(o) > 2 && Math.abs(+avant) > 2 && Math.sign(+avant) !== Math.sign(o);
    if (saut) c.style.transition = "none";
    Object.assign(c.style, { left: p.l + "px", top: p.t + "px", width: p.w + "px", height: p.h + "px", borderRadius: (p.r || 26) + "px" });
    c.className = "carte " + p.cls;
    if (saut) { c.offsetWidth; c.style.transition = ""; }
    c.dataset.o = o;
    const actif = o === 0;
    halos[i].classList.toggle("actif", actif);
    syns[i].classList.toggle("actif", actif);
    etiquettes[i].classList.toggle("actif", actif);
    traits[i].classList.toggle("actif", actif);
    lueurs[i].classList.toggle("actif", actif);

function suivant() { courant = (courant + 1) % N; placer(); }

function dessinerDock(focus) {

}

// Mise à l'échelle de la scène 1920 × 1080 dans la fenêtre
function echelle() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  const s = $("scene");
  s.style.transform = `scale(${k})`;
  s.style.left = (innerWidth - 1920 * k) / 2 + "px";
  s.style.top = (innerHeight - 1080 * k) / 2 + "px";
}
addEventListener("resize", echelle);
