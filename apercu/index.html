<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>iBiTV · Galerie</title>
<!--
  Concept « Galerie » pour la TV, inspiré des interfaces en verre flottant :
  trois étages navigables à la télécommande, et rien de décoratif qui ait l'air d'un bouton.
   1. En haut : Pour vous / Films / Séries (filtres réels), météo (info), Réglages.
   2. Au centre : galerie des titres du moment (TMDB), en carrousel ◀ ▶ ; le titre au centre a
      son synopsis sur un panneau de verre, avec « Regarder sur … » (ouvre l'appli sur ce titre)
      et « Bande-annonce » (recherche YouTube).
   3. En bas : le dock des applis, en grand, avec leur reflet au sol.
-->
<style>
@font-face { font-family: Serif; src: url(polices/instrument-serif-latin-400-normal.woff2); }
@font-face { font-family: M; font-weight: 400; src: url(polices/manrope-latin-400-normal.woff2); }
@font-face { font-family: M; font-weight: 500; src: url(polices/manrope-latin-500-normal.woff2); }
@font-face { font-family: M; font-weight: 600; src: url(polices/manrope-latin-600-normal.woff2); }
@font-face { font-family: M; font-weight: 700; src: url(polices/manrope-latin-700-normal.woff2); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; font-family: M, sans-serif; color: #2b2d33; position: relative;
  background: radial-gradient(ellipse 120% 85% at 50% 22%, #e6e7ea 0%, #d0d1d5 45%, #b4b6bb 75%, #a2a4a9 100%); }
.sol { position: absolute; left: 0; right: 0; top: 770px; bottom: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(236,237,240,.55) 35%, rgba(196,198,203,.9) 100%); }
.horizon { position: absolute; left: 0; right: 0; top: 770px; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); }

/* verre */
.verre { background: linear-gradient(160deg, rgba(255,255,255,.42), rgba(255,255,255,.16) 55%, rgba(255,255,255,.26));
  border: 1.5px solid rgba(255,255,255,.62); backdrop-filter: blur(24px) saturate(1.35);
  box-shadow: 0 1px 0 rgba(255,255,255,.75) inset, 0 18px 40px rgba(40,44,52,.16), 0 2px 6px rgba(40,44,52,.06); }
.pilule { border-radius: 999px; display: inline-flex; align-items: center; }
/* focus télécommande : anneau blanc + contour sombre, léger zoom */
.focus { box-shadow: 0 0 0 3px #fff, 0 0 0 6px rgba(43,45,51,.9), 0 22px 44px rgba(20,22,28,.3) !important; transform: scale(1.05); }

/* ---------- étage 1 ---------- */
.logo { position: absolute; left: 72px; top: 50px; display: flex; align-items: center; gap: 14px; font-size: 27px; font-weight: 700; color: #34363d; }
.logo .pastille { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.logo .pastille svg { width: 26px; height: 26px; }
.logo small { display: block; font-size: 15px; font-weight: 500; color: #7c7f88; margin-top: 2px; }
.onglets { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); padding: 6px; gap: 4px; }
.onglet { padding: 12px 30px; border-radius: 999px; font-size: 19px; font-weight: 600; color: #5d6069; }
.onglet.actif { background: #2b2d33; color: #fff; box-shadow: 0 8px 18px rgba(0,0,0,.22); }
.meteo { position: absolute; right: 150px; top: 54px; padding: 10px 22px 10px 14px; gap: 12px; font-size: 18px; font-weight: 600; color: #34363d; }
.meteo svg { width: 34px; height: 34px; }
.meteo small { color: #7c7f88; font-weight: 500; font-size: 15px; }
.reglages { position: absolute; right: 72px; top: 52px; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.reglages svg { width: 26px; height: 26px; stroke: #34363d; fill: none; stroke-width: 1.9; }

/* ---------- étage 2 : galerie ---------- */
.carte { position: absolute; border-radius: 26px; overflow: hidden; background-size: cover; background-position: center; box-shadow: 0 26px 50px rgba(20,22,28,.28); }
.carte::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 1.5px rgba(255,255,255,.4) inset; background: linear-gradient(140deg, rgba(255,255,255,.28), rgba(255,255,255,0) 35%); }
.carte.loin { filter: blur(3px) saturate(1.2); opacity: .9; }
.carte.tres-loin { filter: blur(6px) saturate(1.1); opacity: .7; }
.carte .etiquette { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 2; color: #fff; font-size: 15px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.reflet-carte { position: absolute; border-radius: 26px; background-size: cover; background-position: center; transform: scaleY(-1); opacity: .2; filter: blur(5px);
  -webkit-mask-image: linear-gradient(180deg, transparent 60%, #000 100%); }
.fleche { position: absolute; top: 372px; width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; }
.fleche svg { width: 24px; height: 24px; stroke: #34363d; fill: none; stroke-width: 2.2; }

.halo { position: absolute; left: 520px; top: 190px; width: 880px; height: 440px; border-radius: 60px; filter: blur(80px) saturate(1.7); opacity: .7; background-size: cover; background-position: center; }
.heros { position: absolute; left: 470px; top: 150px; width: 980px; height: 500px; border-radius: 34px; overflow: hidden; background: #0b0b0e;
  box-shadow: 0 40px 80px rgba(20,22,28,.35), 0 0 0 1px rgba(255,255,255,.1) inset; }
.heros .img { position: absolute; inset: -16px; background-size: cover; background-position: center 30%; filter: blur(3px) saturate(1.35) contrast(1.06); }
.heros .net { position: absolute; inset: 0; background-size: cover; background-position: center 30%; filter: saturate(1.2);
  -webkit-mask-image: radial-gradient(ellipse 50% 55% at 50% 58%, #000 25%, transparent 78%); opacity: .55; }
.heros .voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,8,.9) 0%, rgba(5,5,8,.5) 32%, rgba(5,5,8,.05) 62%, rgba(5,5,8,.4) 100%); }
.heros .haut { position: absolute; left: 34px; right: 34px; top: 28px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
.heros .service { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
.heros .service i { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 17px; font-weight: 800; }
.heros .rang { font-family: Serif; font-size: 22px; opacity: .9; }
.heros h1 { position: absolute; left: 60px; right: 60px; top: 92px; margin: 0; text-align: center; color: #fff; font-family: Serif; font-weight: 400; font-size: 64px; line-height: 1.04; text-shadow: 0 2px 22px rgba(0,0,0,.45); }
.heros .infos { position: absolute; left: 0; right: 0; top: 248px; display: flex; justify-content: center; gap: 8px; }
.badge { padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); color: #fff; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.08); }
.badge.note { background: rgba(255,255,255,.9); color: #1b1c20; border-color: transparent; }

/* panneau synopsis (verre) à cheval sur le bas du héros */
.synopsis { position: absolute; left: 640px; top: 528px; width: 900px; height: 236px; border-radius: 32px; padding: 26px 30px 0 30px; z-index: 6; overflow: hidden;
  background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(246,247,249,.6) 60%, rgba(255,255,255,.7)) !important; backdrop-filter: blur(30px) saturate(1.2) !important; }
.synopsis .tete { display: flex; align-items: center; gap: 12px; font-size: 15px; color: #55585f; font-weight: 600; }
.synopsis .tete b { color: #2b2d33; }
.synopsis p { margin: 10px 0 0; font-size: 19.5px; line-height: 1.5; color: #26282d; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.synopsis .actions { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 12px; }
.bouton { height: 54px; padding: 0 24px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #2b2d33;
  background: rgba(255,255,255,.5); box-shadow: 0 0 0 1.3px rgba(255,255,255,.75) inset, 0 6px 16px rgba(0,0,0,.08); }
.bouton svg { width: 20px; height: 20px; }
.bouton.principal { background: #1d1e22; color: #fff; }
.trait { position: absolute; left: 30px; right: 30px; bottom: 0; height: 4px; border-radius: 4px; }
.trait-lueur { position: absolute; left: 80px; right: 80px; bottom: -16px; height: 40px; border-radius: 40px; filter: blur(22px); opacity: .55; }
.points { position: absolute; right: 30px; bottom: 44px; display: flex; gap: 7px; }
.points i { width: 8px; height: 8px; border-radius: 50%; background: rgba(43,45,51,.25); }
.points i.on { width: 26px; border-radius: 4px; background: #2b2d33; }

/* ---------- étage 3 : dock des applis ---------- */
.onglet-dock { position: absolute; left: 110px; top: 776px; padding: 7px 20px; border-radius: 14px 14px 0 0; font-size: 16px; font-weight: 600; color: #34363d;
  background: rgba(255,255,255,.34); border: 1.5px solid rgba(255,255,255,.62); border-bottom: 0; backdrop-filter: blur(20px); z-index: 7; }
.dock { position: absolute; left: 70px; right: 70px; top: 808px; height: 196px; border-radius: 34px; padding: 22px; display: flex; gap: 18px; z-index: 7; }
.appli { flex: 1; border-radius: 22px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 1.3px rgba(255,255,255,.4) inset, 0 12px 26px rgba(0,0,0,.16); font-weight: 800; font-size: 30px; letter-spacing: -.01em; }
.appli::before { content: ""; position: absolute; inset: 0; background: linear-gradient(150deg, rgba(255,255,255,.28), rgba(255,255,255,0) 40%); }
.appli.focus { transform: scale(1.06) translateY(-6px); }
.appli .nom { position: absolute; left: 0; right: 0; bottom: -30px; text-align: center; font-size: 14px; color: #4b4e57; font-weight: 600; letter-spacing: 0; }
.appli.toutes { background: rgba(255,255,255,.35); color: #34363d; font-size: 17px; font-weight: 700; flex-direction: column; gap: 8px; }
.appli.toutes svg { width: 34px; height: 34px; stroke: #34363d; fill: none; stroke-width: 1.8; }
.reflet-dock { position: absolute; left: 92px; right: 92px; top: 1006px; height: 120px; display: flex; gap: 18px; opacity: .18; filter: blur(5px); transform: scaleY(-1);
  -webkit-mask-image: linear-gradient(180deg, transparent 30%, #000 100%); }
.reflet-dock div { flex: 1; border-radius: 22px; }

.credit { position: absolute; right: 74px; top: 126px; font-size: 13px; color: rgba(60,62,70,.55); }
</style></head>
<body>
<div class="sol"></div><div class="horizon"></div>

<!-- étage 1 -->
<div class="logo"><span class="pastille verre"><svg viewBox="0 0 24 24" fill="none" stroke="#34363d" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/><circle cx="12" cy="12" r="3.2" fill="#e9eaee"/></svg></span>
  <div>iBiTV<small>20:41 · mardi 3 novembre</small></div></div>
<div class="onglets verre pilule"><span class="onglet actif">Pour vous</span><span class="onglet">Films</span><span class="onglet">Séries</span></div>
<div class="meteo verre pilule"><svg viewBox="0 0 64 64"><circle cx="40" cy="22" r="11" fill="#f3c969"/><path d="M18 46h30a10 10 0 000-20 14 14 0 00-26 4 8 8 0 00-4 16z" fill="#fff"/></svg>14°<small>Paris</small></div>
<div class="reglages verre"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></div>
<div class="credit" id="credit">Titres et images : TMDB</div>

<!-- étage 2 : galerie -->
<div id="galerie"></div>
<div class="fleche verre" style="left:432px"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div>
<div class="fleche verre" style="left:1430px"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
<div class="halo" id="halo"></div>
<div class="heros">
  <div class="img" id="h-img"></div><div class="net" id="h-net"></div><div class="voile"></div>
  <div class="haut"><span class="service"><i id="h-logo">N</i><span id="h-service">NETFLIX</span></span><span class="rang">N°1 cette semaine</span></div>
  <h1 id="h-titre"></h1>
  <div class="infos" id="h-infos"></div>
</div>
<div class="synopsis verre">
  <div class="tete"><b id="s-titre"></b><span>·</span><span id="s-sous"></span></div>
  <p id="s-texte"></p>
  <div class="actions">
    <span class="bouton principal focus"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="#fff"/></svg><span id="b-regarder">Regarder sur Netflix</span></span>
    <span class="bouton"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2d33" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="#2b2d33"/></svg>Bande-annonce</span>
  </div>
  <div class="points" id="points"></div>
  <div class="trait-lueur" id="lueur"></div><div class="trait" id="trait"></div>
</div>

<!-- étage 3 : applis -->
<div class="onglet-dock">Mes applis</div>
<div class="dock verre" id="dock"></div>
<div class="reflet-dock" id="reflet-dock"></div>

<script src="donnees.js"></script>
<script>
const T = window.DONNEES.titres;
const fond = (el, url) => { el.style.backgroundImage = `url("${url}")`; };
const SERVICES = {
  "Netflix": { logo: "N", fond: "#000", texte: "#e50914", trait: "linear-gradient(90deg,#e50914,#ff6a3d 55%,#e50914)" },
  "Amazon Prime Video": { logo: "p", fond: "#0f79af", texte: "#fff", trait: "linear-gradient(90deg,#00a8e1,#7fd3f5 55%,#00a8e1)" },
  "Prime Video": { logo: "p", fond: "#0f79af", texte: "#fff", trait: "linear-gradient(90deg,#00a8e1,#7fd3f5 55%,#00a8e1)" },
  "Disney Plus": { logo: "D+", fond: "#0b1e5b", texte: "#fff", trait: "linear-gradient(90deg,#1b3fa8,#4ad0e8 55%,#1b3fa8)" },
  "Disney+": { logo: "D+", fond: "#0b1e5b", texte: "#fff", trait: "linear-gradient(90deg,#1b3fa8,#4ad0e8 55%,#1b3fa8)" },
  "Canal+": { logo: "+", fond: "#000", texte: "#fff", trait: "linear-gradient(90deg,#222,#888 55%,#222)" },
  "CANAL+": { logo: "+", fond: "#000", texte: "#fff", trait: "linear-gradient(90deg,#222,#888 55%,#222)" },
};
const defaut = { logo: "▶", fond: "rgba(255,255,255,.2)", texte: "#fff", trait: "linear-gradient(90deg,#4f8df5,#f07090 40%,#f2d160 62%,#7dcf8a)" };

// Titre au centre : le premier ; les voisins de part et d'autre (carrousel)
const h = T[0];
const sv = SERVICES[h.plateforme] || defaut;
for (const id of ["h-img", "h-net", "halo"]) fond(document.getElementById(id), h.backdrop);
document.getElementById("h-titre").textContent = h.titre;
document.getElementById("h-service").textContent = (h.plateforme || "").toUpperCase();
const lg = document.getElementById("h-logo"); lg.textContent = sv.logo; lg.style.background = sv.fond; lg.style.color = sv.texte;
document.getElementById("h-infos").innerHTML = [h.sous.split(" · ")[0], h.sous.split(" · ")[1], h.annee].filter(Boolean).map(x => `<span class="badge">${x}</span>`).join("")
  + (h.note ? `<span class="badge note">★ ${h.note}</span>` : "");
document.getElementById("s-titre").textContent = h.titre;
document.getElementById("s-sous").textContent = [h.sous, h.annee].filter(Boolean).join(" · ");
document.getElementById("s-texte").textContent = h.resume || "Résumé du titre, fourni par TMDB en français.";
document.getElementById("b-regarder").textContent = h.plateforme && SERVICES[h.plateforme] ? "Regarder sur " + h.plateforme.replace("Amazon ", "") : "Où regarder ?";
document.getElementById("trait").style.background = sv.trait;
document.getElementById("lueur").style.background = sv.trait;
document.getElementById("points").innerHTML = T.slice(0, 7).map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("");

// Voisins : affiches, plus floues et plus petites en s'éloignant
const g = document.getElementById("galerie");
const voisins = [
  { t: T[T.length - 1], l: 182, top: 222, w: 230, h: 345, cls: "loin" },
  { t: T[T.length - 2], l: -88, top: 262, w: 200, h: 300, cls: "tres-loin" },
  { t: T[1], l: 1508, top: 222, w: 230, h: 345, cls: "loin" },
  { t: T[2], l: 1790, top: 262, w: 200, h: 300, cls: "tres-loin" },
];
for (const v of voisins) {
  const d = document.createElement("div");
  d.className = "carte " + v.cls;
  Object.assign(d.style, { left: v.l + "px", top: v.top + "px", width: v.w + "px", height: v.h + "px" });
  fond(d, v.t.poster);
  g.appendChild(d);
  const r = document.createElement("div");
  r.className = "reflet-carte";
  Object.assign(r.style, { left: v.l + "px", top: (v.top + v.h + 8) + "px", width: v.w + "px", height: v.h * 0.5 + "px" });
  fond(r, v.t.poster);
  g.appendChild(r);
}

// Dock des applis (favoris de l'accueil) + « Toutes les applis »
const APPS = [
  { nom: "Netflix", html: '<span style="color:#e50914">NETFLIX</span>', fond: "#121212" },
  { nom: "Prime Video", html: "prime video", fond: "linear-gradient(135deg,#0f79af,#00a8e1)", couleur: "#fff" },
  { nom: "Disney+", html: "Disney+", fond: "linear-gradient(135deg,#0b1e5b,#1a46b8)", couleur: "#fff" },
  { nom: "CANAL+", html: "CANAL+", fond: "#000", couleur: "#fff" },
  { nom: "iBiTube", html: '<span style="color:#1e90ff">iBi</span><span style="color:#fff">Tube</span>', fond: "#0a1020" },
  { nom: "Spotify", html: "Spotify", fond: "#1db954", couleur: "#0b0b0b" },
];
const dock = document.getElementById("dock"), rd = document.getElementById("reflet-dock");
APPS.forEach((a, i) => {
  dock.insertAdjacentHTML("beforeend", `<div class="appli" style="background:${a.fond};color:${a.couleur || "#fff"}">${a.html}</div>`);
  rd.insertAdjacentHTML("beforeend", `<div style="background:${a.fond}"></div>`);
});
dock.insertAdjacentHTML("beforeend", '<div class="appli toutes"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>Toutes les applis</div>');
rd.insertAdjacentHTML("beforeend", '<div style="background:rgba(255,255,255,.5)"></div>');
if (window.DONNEES.source !== "tmdb") document.getElementById("credit").textContent = "Images provisoires (remplacées par TMDB)";
window.pret = true;
</script>
</body></html>
